version: 0.2

# ─────────────────────────────────────────────────────────────────────────────
# AWS CodeBuild Spec — MERN App CI/CD Pipeline
# Builds Docker image, pushes to ECR, writes imagedefinitions.json for ECS
#
# Required CodeBuild environment variables (set in CodeBuild project console):
#   AWS_DEFAULT_REGION  → us-east-1
#   AWS_ACCOUNT_ID      → 968077439955
#   IMAGE_REPO_NAME     → mern-app-repo
#   IMAGE_TAG           → latest  (or use $CODEBUILD_RESOLVED_SOURCE_VERSION)
# ─────────────────────────────────────────────────────────────────────────────

env:
  variables:
    AWS_DEFAULT_REGION: "us-east-1"
    AWS_ACCOUNT_ID: "968077439955"
    IMAGE_REPO_NAME: "mern-app-repo"
    IMAGE_TAG: "latest"

phases:

  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "==> Installing dependencies for smoke test..."
      - cd server && npm ci --only=production && cd ..

  pre_build:
    commands:
      - echo "==> Logging in to Amazon ECR..."
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - ECR_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME
      - echo "ECR URI = $ECR_URI"
      - echo "==> Pre-build phase complete."

  build:
    commands:
      - echo "==> Build started on $(date)"
      - echo "==> Building Docker image..."
      - docker build -t $IMAGE_REPO_NAME:$IMAGE_TAG .
      - echo "==> Docker image built successfully."

  post_build:
    commands:
      - echo "==> Tagging image for ECR..."
      - docker tag $IMAGE_REPO_NAME:$IMAGE_TAG $ECR_URI:$IMAGE_TAG
      - echo "==> Pushing image to ECR..."
      - docker push $ECR_URI:$IMAGE_TAG
      - echo "==> Writing imagedefinitions.json for ECS deployment..."
      - printf '[{"name":"mern-app-container","imageUri":"%s"}]' "$ECR_URI:$IMAGE_TAG" > imagedefinitions.json
      - cat imagedefinitions.json
      - echo "==> Post-build phase complete on $(date)"

artifacts:
  files:
    - imagedefinitions.json
    - appspec.yml
    - taskdef.json
